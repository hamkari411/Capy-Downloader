<!doctype html>
<html lang="es" data-theme="cyber">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="topbar">
    <div class="brand"><img src="icons/icon32.png" alt="" width="20" height="20">Capy Downloader</div>
    <button id="settings" class="icon-btn" title="Ajustes" aria-label="Ajustes" aria-expanded="false" aria-controls="panel">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
  <section id="panel" class="panel" hidden>
    <h2>Carpeta de descargas</h2>
    <p id="panelDir" class="panel-dir">Descargas</p>
    <div class="panel-actions">
      <button id="pickDir" class="btn">Elegir carpeta</button>
      <button id="resetDir" class="link">Usar Descargas</button>
    </div>
    <p id="panelMsg" class="panel-msg" role="status"></p>
    <h2>Color</h2>
    <div id="themeChips" class="chips" role="radiogroup" aria-label="Tema"></div>
    <button id="moreSettings" class="link">Más ajustes</button>
  </section>

  <header id="video" hidden>
    <img id="thumb" alt="">
    <div>
      <h1 id="title"></h1>
      <p id="meta"></p>
    </div>
  </header>

  <p id="status" class="status">Leyendo el video…</p>

  <section id="formats" hidden>
    <h2>Video con audio</h2>
    <ul id="videos" class="list"></ul>

    <h2>Solo audio</h2>
    <ul class="list audio">
      <li><button data-audio="mp3"><strong>MP3</strong><span>320 kbps, funciona en todo</span></button></li>
      <li><button data-audio="m4a"><strong>M4A</strong><span>AAC, mejor calidad por tamaño</span></button></li>
      <li><button data-audio="original"><strong>Original</strong><span>Tal cual viene de la plataforma, sin convertir</span></button></li>
    </ul>
    <p class="dest">Se guarda en <span id="destPath">Descargas</span><button id="changeDir" class="link">Cambiar</button></p>
  </section>

  <section id="jobs-wrap" hidden>
    <div class="jobs-head">
      <h2>Descargas</h2>
      <button id="clear" class="link">Limpiar terminadas</button>
    </div>
    <ul id="jobs"></ul>
    <button id="folder" class="link">Abrir carpeta</button>
  </section>

  <script src="theme.js"></script>
  <script src="popup.js"></script>
</body>
</html>
